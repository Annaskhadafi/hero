<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#102f46"/></linearGradient><linearGradient id="a"><stop stop-color="#16d6a3"/><stop offset="1" stop-color="#44b7ff"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg)"/><circle cx="1000" cy="90" r="220" fill="#1ad6a3" opacity=".06"/><circle cx="50" cy="1200" r="260" fill="#3bbcff" opacity=".06"/><g font-family="Arial,sans-serif"><text x="64" y="73" font-size="20" font-weight="700" letter-spacing="3" fill="#62e7c2">PANDUAN TEKNIS • PERSIAPAN TANYA JAWAB JURI</text><text x="60" y="154" font-size="75" font-weight="800" fill="#fff">HERO: DI BALIK LAYAR</text><text x="64" y="198" font-size="24" fill="#bbd2df">Server • Keamanan • Backup • Ancaman • Update</text><rect x="64" y="224" width="952" height="5" rx="2" fill="url(#a)"/><rect x="64" y="250" width="952" height="120" rx="20" fill="#12354a"/><text x="90" y="286" font-size="20" font-weight="700" fill="#62e7c2">ALUR DATA</text><text x="90" y="324" font-size="19" fill="#edf7fb">Pengguna → Next.js (UI + server/API) → autentikasi &amp; izin (RBAC)</text><text x="90" y="352" font-size="19" fill="#edf7fb">→ PostgreSQL via Drizzle ORM • Dokumen: private S3 / persistent storage</text><rect x="64" y="394" width="456" height="310" rx="20" fill="#12354a"/><text x="90" y="434" font-size="23" font-weight="700" fill="#62e7c2">KEAMANAN &amp; ANCAMAN</text><text x="90" y="473" font-size="18" fill="#edf7fb"><tspan x="90">Risiko: akun dicuri • akses berlebih</tspan><tspan x="90" dy="25">• input berbahaya • penyalahgunaan file/API.</tspan><tspan x="90" dy="34" font-weight="700" fill="#fff">Lapisan kontrol di HERO:</tspan><tspan x="90" dy="27">• Auth + pengecekan akses di server.</tspan><tspan x="90" dy="25">• RBAC dan cakupan akses pelanggan.</tspan><tspan x="90" dy="25">• Beberapa upload/API wajib sesi.</tspan><tspan x="90" dy="34" fill="#ffd58a">Checklist keamanan masih punya tindak</tspan><tspan x="90" dy="24" fill="#ffd58a">lanjut. Tidak ada klaim “100% aman”;</tspan><tspan x="90" dy="24" fill="#ffd58a">review dan perbaikan berjalan bertahap.</tspan></text><rect x="544" y="394" width="472" height="310" rx="20" fill="#12354a"/><text x="570" y="434" font-size="23" font-weight="700" fill="#62e7c2">BACKUP &amp; PEMULIHAN</text><text x="570" y="473" font-size="18" fill="#edf7fb"><tspan x="570">• Cron dump PostgreSQL → kompres .sql.gz</tspan><tspan x="570" dy="25">  → simpan ke S3; memakai CRON_SECRET.</tspan><tspan x="570" dy="25">• Retensi default 3 bulan; backup terbaru</tspan><tspan x="570" dy="25">  dilindungi dari penghapusan.</tspan><tspan x="570" dy="34" font-weight="700" fill="#fff">Restore:</tspan><tspan x="570" dy="25">butuh konfirmasi &amp; membuat snapshot</tspan><tspan x="570" dy="25">backup sebelum pemulihan.</tspan><tspan x="570" dy="30" fill="#ffd58a">Pantau jadwal; uji restore berkala.</tspan><tspan x="570" dy="23" fill="#ffd58a">Backup belum terbukti sampai berhasil</tspan><tspan x="570" dy="23" fill="#ffd58a">dipulihkan.</tspan></text><rect x="64" y="730" width="456" height="240" rx="20" fill="#12354a"/><text x="90" y="770" font-size="23" font-weight="700" fill="#62e7c2">SERVER &amp; FILE</text><text x="90" y="809" font-size="18" fill="#edf7fb"><tspan x="90">• Aplikasi: Next.js + TypeScript.</tspan><tspan x="90" dy="27">• Database: PostgreSQL + Drizzle ORM.</tspan><tspan x="90" dy="27">• Produksi memakai Dokploy; dokumen</tspan><tspan x="90" dy="25">  di S3 private / persistent mount.</tspan><tspan x="90" dy="34" fill="#ffd58a">Batasi akses server &amp; secret; jangan</tspan><tspan x="90" dy="24" fill="#ffd58a">bocorkan credential atau log sensitif.</tspan></text><rect x="544" y="730" width="472" height="240" rx="20" fill="#12354a"/><text x="570" y="770" font-size="23" font-weight="700" fill="#62e7c2">UPDATE &amp; RILIS</text><text x="570" y="809" font-size="18" fill="#edf7fb"><tspan x="570">1. Review perubahan &amp; dependency.</tspan><tspan x="570" dy="27">2. Jalankan lint, type-check, tests.</tspan><tspan x="570" dy="27">3. Build, deploy, cek fungsi penting.</tspan><tspan x="570" dy="35" fill="#ffd58a">Update menutup celah yang diketahui,</tspan><tspan x="570" dy="24" fill="#ffd58a">namun harus diuji dulu dan disertai</tspan><tspan x="570" dy="24" fill="#ffd58a">rencana rollback.</tspan></text><text x="64" y="1016" font-size="24" font-weight="700" fill="#fff">JAWABAN AMAN UNTUK PERTANYAAN JURI</text><rect x="64" y="1040" width="952" height="225" rx="20" fill="#0d293b" stroke="#28516a"/><text x="90" y="1077" font-size="18" font-weight="700" fill="#62e7c2">“Kalau server diretas, bagaimana?”</text><text x="90" y="1104" font-size="17" fill="#e3eef3">“Akses dibatasi dengan autentikasi dan izin server-side, secret dijaga,</text><text x="90" y="1127" font-size="17" fill="#e3eef3">dan kerentanan ditinjau. Tidak ada sistem yang bisa dijamin 100% aman.”</text><text x="90" y="1164" font-size="18" font-weight="700" fill="#62e7c2">“Bagaimana jika data hilang / update bermasalah?”</text><text x="90" y="1191" font-size="17" fill="#e3eef3">“Ada mekanisme backup ke S3 dan prosedur restore; jadwal serta uji</text><text x="90" y="1214" font-size="17" fill="#e3eef3">pemulihan harus dipantau. Rilis diuji dan perlu rencana rollback.”</text><rect x="64" y="1286" width="952" height="42" rx="13" fill="#103d4c"/><text x="84" y="1314" font-size="15" font-weight="700" fill="#fff">JANGAN MENGARANG:</text><text x="258" y="1314" font-size="15" fill="#d7e8ef">jadwal aktual, enkripsi, SLA, atau hasil audit tanpa bukti.</text><text x="64" y="1345" font-size="12" fill="#8daab9">Sumber: HERO backup code, cron route, security tasklist, package scripts &amp; deployment docs.</text></g></svg>