[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --ignore-scripts"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "sh -lc 'if [ -n \"$DATABASE_URL\" ] || [ -n \"$POSTGRES_URL\" ] || [ -n \"$POSTGRES_PRISMA_URL\" ] || [ -n \"$POSTGRESQL_URL\" ] || [ -n \"$DATABASE_PUBLIC_URL\" ]; then node scripts/run-docker-migrations.mjs; else echo \"DATABASE_URL alias not set - skipping migrations.\"; fi && next start'"
