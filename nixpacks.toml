[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.setup]
nixPkgs = ["nodejs_20", "postgresql"]

[phases.install]
cmds = ["npm install --ignore-scripts"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "sh -lc 'if [ \"$RUN_MIGRATIONS\" = \"true\" ] && { [ -n \"$DATABASE_URL\" ] || [ -n \"$POSTGRES_URL\" ] || [ -n \"$POSTGRES_PRISMA_URL\" ] || [ -n \"$POSTGRESQL_URL\" ] || [ -n \"$DATABASE_PUBLIC_URL\" ]; }; then node scripts/run-docker-migrations.mjs; else echo \"RUN_MIGRATIONS=true or database URL not set - skipping migrations.\"; fi && next start -H 0.0.0.0 -p ${PORT:-3000}'"
