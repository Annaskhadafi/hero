[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
PORT = "3000"
HOSTNAME = "0.0.0.0"

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --ignore-scripts"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "sh -lc 'node scripts/run-docker-migrations.mjs && npm run start'"
