<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#102f46"/></linearGradient><linearGradient id="accent"><stop stop-color="#16d6a3"/><stop offset="1" stop-color="#44b7ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter></defs>
<rect width="1080" height="1350" fill="url(#bg)"/><circle cx="1000" cy="90" r="220" fill="#1ad6a3" opacity=".06"/><circle cx="50" cy="1200" r="260" fill="#3bbcff" opacity=".06"/>
<text x="64" y="82" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#62e7c2">PANDUAN CEPAT • PRESENTASI &amp; TANYA JAWAB</text>
<text x="60" y="172" font-family="Arial,sans-serif" font-size="82" font-weight="800" fill="#fff">HERO</text><text x="64" y="218" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#bbd2df">Hub for Employee Reporting &amp; Operations</text>
<rect x="64" y="250" width="952" height="6" rx="3" fill="url(#accent)"/>
<text x="64" y="306" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">APA ITU?</text><text x="64" y="342" font-family="Arial,sans-serif" font-size="22" fill="#d5e5ed"><tspan x="64">Platform terpadu untuk menyatukan proses operasional, Human Capital,</tspan><tspan x="64" dy="30">HSE, manajemen ban, dan layanan pelanggan MAESTRO.</tspan></text>
<!-- architecture -->
<rect x="64" y="403" width="952" height="246" rx="24" fill="#12354a" stroke="#2a566b" filter="url(#shadow)"/><text x="94" y="444" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#62e7c2">ALUR TEKNIS SEDERHANA</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="92" y="473" width="190" height="67" rx="14" fill="#1d4a60"/><text x="187" y="514" font-size="20" font-weight="700" fill="white">Pengguna / UI</text><text x="302" y="515" font-size="30" fill="#62e7c2">›</text><rect x="324" y="473" width="200" height="67" rx="14" fill="#1d4a60"/><text x="424" y="504" font-size="18" font-weight="700" fill="white">Next.js</text><text x="424" y="528" font-size="15" fill="#c8dce5">Server Actions / API</text><text x="543" y="515" font-size="30" fill="#62e7c2">›</text><rect x="565" y="473" width="190" height="67" rx="14" fill="#1d4a60"/><text x="660" y="504" font-size="18" font-weight="700" fill="white">Auth + RBAC</text><text x="660" y="528" font-size="15" fill="#c8dce5">validasi akses</text><text x="774" y="515" font-size="30" fill="#62e7c2">›</text><rect x="796" y="473" width="190" height="67" rx="14" fill="#1d4a60"/><text x="891" y="514" font-size="20" font-weight="700" fill="white">PostgreSQL</text></g>
<text x="94" y="585" font-family="Arial,sans-serif" font-size="18" fill="#c8dce5">File: S3 / penyimpanan persisten  •  Notifikasi: email &amp; notifikasi aplikasi</text>
<!-- cards -->
<g font-family="Arial,sans-serif"><rect x="64" y="675" width="456" height="211" rx="22" fill="#12354a"/><text x="92" y="717" font-size="23" font-weight="700" fill="#62e7c2">STACK UTAMA</text><text x="92" y="757" font-size="20" fill="#edf7fb">• Next.js 16 + TypeScript</text><text x="92" y="792" font-size="20" fill="#edf7fb">• PostgreSQL + Drizzle ORM</text><text x="92" y="827" font-size="20" fill="#edf7fb">• Better Auth + session-cookie RBAC</text><text x="92" y="862" font-size="20" fill="#edf7fb">• Tailwind CSS • S3 object storage</text>
<rect x="544" y="675" width="472" height="211" rx="22" fill="#12354a"/><text x="572" y="717" font-size="23" font-weight="700" fill="#62e7c2">KAPABILITAS</text><text x="572" y="757" font-size="20" fill="#edf7fb">• Operasional &amp; aktivitas lapangan</text><text x="572" y="792" font-size="20" fill="#edf7fb">• HC: roster, timesheet, training, LMS</text><text x="572" y="827" font-size="20" fill="#edf7fb">• HSE: inspeksi 5R, PTW, insiden</text><text x="572" y="862" font-size="20" fill="#edf7fb">• MAESTRO: portal pelanggan terpisah</text></g>
<text x="64" y="940" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">JAWABAN SINGKAT UNTUK PERTANYAAN JURI</text>
<g font-family="Arial,sans-serif"><rect x="64" y="966" width="952" height="264" rx="22" fill="#0d293b" stroke="#28516a"/><text x="92" y="1007" font-size="19" font-weight="700" fill="#62e7c2">Bagaimana menjaga akses data?</text><text x="92" y="1034" font-size="18" fill="#e3eef3">“Autentikasi dan pemeriksaan role/izin dilakukan di sisi server;</text><text x="92" y="1058" font-size="18" fill="#e3eef3">akses data pelanggan juga dibatasi sesuai cakupannya.”</text><text x="92" y="1098" font-size="19" font-weight="700" fill="#62e7c2">Bagaimana memastikan kualitas?</text><text x="92" y="1125" font-size="18" fill="#e3eef3">“Kami memakai unit test, type-check, lint, dan pengujian E2E;</text><text x="92" y="1149" font-size="18" fill="#e3eef3">cakupan test yang relevan dijalankan sebelum rilis.”</text><text x="92" y="1189" font-size="19" font-weight="700" fill="#62e7c2">Kenapa dibuat?</text><text x="92" y="1216" font-size="18" fill="#e3eef3">“Agar alur kerja lintas fungsi lebih terintegrasi, tercatat, dan mudah dipantau.”</text></g>
<rect x="64" y="1254" width="952" height="58" rx="16" fill="#103d4c"/><text x="88" y="1289" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">TIPS JURI:</text><text x="204" y="1289" font-family="Arial,sans-serif" font-size="18" fill="#d7e8ef">Jelaskan alur fitur yang benar-benar pernah diuji. Jangan klaim “100% aman”.</text>
<text x="64" y="1336" font-family="Arial,sans-serif" font-size="14" fill="#8daab9">Berdasarkan dokumentasi proyek HERO (README &amp; package.json). Detail implementasi dapat berkembang.</text></svg>