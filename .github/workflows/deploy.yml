name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: [self-hosted, Windows, X64]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case repository name
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_REPOSITORY)) {
            throw "GITHUB_REPOSITORY is empty"
          }
          "IMAGE_NAME=$($env:GITHUB_REPOSITORY.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=https://hero.chitraparatama.com

      - name: Trigger Dokploy Webhook (Optional)
        if: env.DOKPLOY_WEBHOOK_URL != ''
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering Dokploy deployment webhook..."
          curl -X POST -f "$DOKPLOY_WEBHOOK_URL" || echo "Webhook trigger completed or skipped."
