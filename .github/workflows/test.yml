name: HERO Automated Testing CI Pipeline (PTW & Workflow Engine)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Run Lint, Type-Check, CRUD Integration & Playwright E2E Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Run ESLint Code Quality Checks
        run: npm run lint

      - name: 5. Run TypeScript Type Check
        run: npm run type-check

      - name: 6. Run PTW, SPL, Daily Activity, and SOP/WIN Approval & Matrix CRUD & Integration Tests
        run: |
          npx tsx --test tests/ptw-approval-crud.test.ts
          npx tsx --test tests/spl-approval-crud.test.ts
          npx tsx --test tests/daily-activity-approval-crud.test.ts
          npx tsx --test tests/sop-win-approval-crud.test.ts
          node tests/ptw-approval-contract.test.mjs
          node tests/spl-approval-contract.test.mjs
          node tests/daily-activity-approval-contract.test.mjs
          node tests/sop-win-approval-contract.test.mjs

      - name: 7. Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: 8. Build Next.js Application Bundle
        run: npm run build

      - name: 9. Run Playwright E2E Workflow Tests
        run: npm run test:playwright

      - name: 10. Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
